spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: doctors-service
              uri: http://localhost:9901
              predicates:
                - Path=/api/doctors/**

            - id: patients-service
              uri: http://localhost:9902
              predicates:
                - Path=/api/patients/**

            - id: billing-service
              uri: http://localhost:9903
              predicates:
                - Path=/api/billing/**

            - id: appointments-service
              uri: http://localhost:9904
              predicates:
                - Path=/api/appointments/**

server:
  port: 0
